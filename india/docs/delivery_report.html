  function runProfileSVG() {
    var plotW = RP.w - RP.left - RP.right;
    var step = plotW / DAILY.length;
    var barW = Math.min(30, step - 8);
    var barBase = RP.top + RP.barH;
    var cumBase = RP.cumTop + RP.cumH;
    var yDay = function (v) { return barBase - (v / RP.dayMax) * RP.barH; };
    var yCum = function (v) { return cumBase - (v / RP.cumMax) * RP.cumH; };
    var s = [];

    // daily plot: grid and ticks
    [0, 500, 1000].forEach(function (t) {
      var y = yDay(t);
      s.push('<line class="g-line" x1="' + RP.left + '" y1="' + y.toFixed(1) +

    var pts = DAILY.map(function (d, i) {
      return [RP.left + step * i + step / 2, 0];

    var running = 0;
    DAILY.forEach(function (d, i) { running += d[1]; pts[i][1] = yCum(running); });
    // the area closes on the last day, not on the plot edge: nothing was
    // delivered after the 21st and the fill should not imply otherwise
    var last = pts[pts.length - 1];
    var area = 'M' + RP.left + ',' + cumBase +
      pts.map(function (p) { return ' L' + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('') +
      ' L' + last[0].toFixed(1) + ',' + cumBase + ' Z';
    s.push('<path class="a-fill" d="' + area + '" />');
    s.push('<path class="a-line" d="M' + pts.map(function (p) {

      s.push('<rect class="b-built" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +

        num(d[2]) + '</b> queued \u00b7 <b>' + d[3].toFixed(0) + '</b> GB';
    }
  };

  var PAD = 8;

  function hideTips(except) {
    var tips = document.querySelectorAll('.chart-frame .tip');
    for (var i = 0; i < tips.length; i++) {
      if (tips[i] !== except) tips[i].style.opacity = '0';
    }
  }

  function onPointerMove(e) {
    var target = e.target;
    if (!target || !target.closest) { hideTips(null); return; }
    var frame = target.closest('.chart-frame');
    if (!frame) { hideTips(null); return; }
    var tip = frame.querySelector('.tip');
    var describe = CHART_TIPS[frame.id];
    var hit = target.closest('.hit');
    if (!tip || !describe || !hit) { hideTips(null); return; }
    hideTips(tip);

    tip.innerHTML = describe(+hit.getAttribute('data-i'));
    tip.style.opacity = '1';

    // Measure after the text is in, and place in the frame's own coordinates.
    var fr = frame.getBoundingClientRect();
    var hr = hit.getBoundingClientRect();
    var tw = tip.offsetWidth, th = tip.offsetHeight;

    // Centre on the hovered column, then keep the whole box inside the frame.
    var x = hr.left - fr.left + hr.width / 2;
    var half = tw / 2;
    x = Math.max(half + PAD, Math.min(fr.width - half - PAD, x));

    // Sit above the pointer; flip below when there is no room above.
    var y = e.clientY - fr.top - 12;
    var flip = (y - th) < PAD;
    tip.style.transform = flip ? 'translate(-50%, 0)' : 'translate(-50%, -100%)';
    tip.style.top = (flip ? y + 28 : y) + 'px';
    tip.style.left = x + 'px';
  }

                'the hour of overpass.</p>' +
                '<p>Cloud and shadow are removed by a witness mask: Collection 2 QA bits combined with a ' +
                'per-pixel thermal witness built from that pixel’s clear-sky history. Both must agree.</p>')
          )
        )
      ),
      h('div', { className: 'two-col' },
        h(DS.Card, { title: 'Compositing' },
          h('div', { className: 'card-body justify' },
            raw('<p>Per pixel, the year is reduced to a median plus a dry and a wet composite — the p25 ' +
                'and p75 of the observations ordered by NDVI — and two measures of how far the pixel ' +
                'travelled during the year: swing (p95 − p5) and the median absolute deviation.</p>' +
                '<p>Reducing by quartile rather than by calendar month keeps the composites comparable ' +
                'across a country whose monsoon arrives on very different dates.</p>')
          )
        ),
        h(DS.Card, { title: 'Spectral mixture analysis' },
          h('div', { className: 'card-body justify' },
            raw('<p>Twenty-four bands of gv, npv, soil, shade and NDFI, unmixed in the ×10,000 space the ' +
                'endmembers were calibrated in.</p>' +
                '<p>The endmembers are <strong>inherited from the Amazon</strong> and were not re-derived ' +
                'for India. This is recorded in the pre-flight and is the first thing to revisit if the ' +
                'SMA bands disagree with field expectation.</p>')
          )
        )
      ),
      h(DS.InfoBanner, { icon: 'BookOpen' },
        'The authoritative description of the method is the ATBD (docs/IOLN Landsat Mosaics ATBD.pdf); ' +
        'every tunable value lives in pipeline/config.py. This report records the run, not the algorithm.')
    );
  }

  function Coverage() {
    var complete = BUILT_BY_YEAR.filter(function (r) { return r[1] === CELLS; }).length;
    return h('section', { id: 'coverage' },
      head('Coverage', 'What the archive allowed, year by year',
        'Each column is one phenological year against the full ' + CELLS + '-cell grid. Where a column ' +
        'falls short, the Landsat archive itself is short — not the pipeline.'),
      h(DS.Panel, { title: 'Cells delivered per phenological year', padding: 24 },
        h('div', { className: 'chart-head' },
          h('div', { className: 'legend' },
            h('span', null, h('i', { style: { background: 'var(--color-primary-700)' } }), 'Delivered'),
            h('span', null, h('i', { style: { background: 'var(--color-neutral-300)' } }), 'Not built')
          ),
          h('span', { className: 't-note ink-second' }, 'Full height = ' + CELLS + ' cells')
        ),
        h('div', { className: 'chart-frame', id: 'chartframe' },
          h('div', { className: 'chart-scroll' }, raw(chartSVG())),
          h('div', { className: 'tip' })
        ),
        h('div', { style: { marginTop: '16px' } },
          h('details', null,
            h('summary', null, 'Figures behind the chart'),
            h('div', { className: 'table-scroll' },
              h('table', null,
                h('caption', null, 'Cells delivered and not built, out of ' + CELLS + ', per phenological year.'),
                h('thead', null, h('tr', null,
                  h('th', null, 'Year'), h('th', { className: 'n' }, 'Delivered'),
                  h('th', { className: 'n' }, 'Not built'), h('th', { className: 'n' }, 'Coverage')
                )),
                h('tbody', null, BUILT_BY_YEAR.map(function (r) {
                  return h('tr', { key: r[0] },
                    h('td', { className: 'k num' }, r[0]),
                    h('td', { className: 'n' }, r[1]),
                    h('td', { className: 'n' }, CELLS - r[1]),
                    h('td', { className: 'n' }, (r[1] / CELLS * 100).toFixed(1) + '%')
                  );
                }))
              )
            )
          )
        )
      ),
      h('div', { className: 'prose justify' },
        raw('<p><strong>1986 is the thin year</strong>: 30 cells of 283. Only Landsat 5 was flying, on a ' +
            'single pass, and much of the Indian archive from that year was never downlinked or never ' +
            'survived. 1987 and 1988 recover to about 220, and from 1989 the series is above 95% every ' +
            'year but 1998.</p>' +
            '<p>From 1999 onward the grid is essentially complete: <strong>' + complete + ' of the forty years ' +
            'deliver all ' + CELLS + ' cells</strong>, and the remaining shortfalls are one or three cells ' +
            'held back by the two defects described below, not by the archive.</p>')
      )
    );
  }

  function NationalGrid() {
    return h('section', { id: 'national' },
      head('National scale', 'Forty years of India, one tile a year',
        'Every phenological year mosaicked to the whole country, at the same extent and the same ' +
        'stretch, so the tiles are comparable to each other. Read left to right, top to bottom, and ' +
        'the archive fills in: what changes between tiles is how much of India a year could see.'),
      h('div', { className: 'years' },
        BUILT_BY_YEAR.map(function (r) {
          var year = r[0], built = r[1];
          return h('figure', { className: 'year-tile', key: year, 'data-thin': built < CELLS ? '1' : '0' },
            h('img', {
              src: IMG['india_' + year],
              alt: 'National mosaic of India for the ' + year + ' phenological year, ' +
                   built + ' of ' + CELLS + ' cells delivered',
              loading: 'lazy', width: 450, height: 480
            }),
            h('figcaption', null,
              h('span', { className: 'y' }, year),
              h('span', { className: 'c' }, built + '/' + CELLS)
            )
          );
        })
      ),
      h(DS.InfoBanner, { icon: 'Crop' },
        'Black is not one thing. Around the country it is the region mask, the last step of the build, ' +
        'which drops every pixel outside the union of the classification regions — so the outline you ' +
        'read as India is the mask, not the sensor. Black cutting across the interior is the archive: ' +
        'cells with no usable scene that year. The bands through 1987 and 1988 are whole Landsat rows ' +
        'that were never downlinked.'),
      h('p', { className: 't-note ink-second' },
        'Red, green and blue medians stretched 0–4,000 at gamma 1.3, the parameters in ' +
        'docs/visualize_stuck_mosaics.js. The count under each tile is the cells delivered that year.')
    );
  }

  function Outcome() {
    return h('section', { id: 'outcome' },
      head('Outcome', 'Every planned image accounted for',
        'The plan is ' + num(PLAN) + ' images. The collection is the source of truth for what was ' +
        'delivered; the remainder is classified by cause.'),
      h(DS.Panel, { title: 'Reconciliation against the plan', padding: 0 },
        h('div', { className: 'table-scroll table-flush' },
          h('table', null,
            h('thead', null, h('tr', null,
              h('th', null, 'Outcome'), h('th', { className: 'n' }, 'Cell-years'),
              h('th', { className: 'n' }, 'Share'), h('th', null, 'Why')
            )),
            h('tbody', null, OUTCOMES.map(function (o) {
              return h('tr', { key: o.k },
                h('td', null, h(DS.StatusPill, { tone: o.tone }, o.k)),
                h('td', { className: 'n ink-max', style: { fontWeight: 700 } }, num(o.n)),
                h('td', { className: 'n' }, (o.n / PLAN * 100).toFixed(o.n < 100 ? 2 : 1) + '%'),
                h('td', null, o.w)
              );
            }))
          )
        )
      ),
      h('div', { className: 'two-col' },
        h(DS.Card, { title: 'The eight blocked cells' },
          h('div', { className: 'card-body justify' },
            raw('<p>Each has between one and six granules, but the 6S overpass table for them comes back ' +
                'empty and the topographic step calls <span class="path">len()</span> on it.</p>' +
                '<p><span class="path">NC-43-Y-C</span> (1989, 2000, 2010) · ' +
                '<span class="path">NC-44-Y-C_1989</span> · <span class="path">NG-46-Z-D_1986</span> · ' +
                '<span class="path">NH-44-X-C_1987</span> · <span class="path">NI-43-V-C_1986</span> · ' +
                '<span class="path">NI-44-Y-D_1988</span></p>' +
                '<p>Treating an empty table as “no correction available” instead of an error releases all ' +
                'eight. The guard has not been written yet.</p>')
          )
        ),
        h(DS.Card, { title: 'A quality caveat worth reading' },
          h('div', { className: 'card-body justify' },
            raw('<p>Some L5 and L7 passes have no matching row in the 6S table for their cell and date. ' +
                'Those passes are shipped <strong>without topographic correction</strong>, with a ' +
                '<span class="path">WARNING … ship UNCORRECTED</span> in the run log.</p>' +
                '<p>The images are delivered and usable; the affected passes carry a slope-dependent ' +
                'illumination bias. Quantifying that bias is an open item.</p>')
          )
        )
      )
    );
  }

  function Gallery() {
    return h('section', { id: 'mosaics' },
      head('The images', 'Six mosaics, six landscapes',
        'True-colour renderings (red, green and blue medians) of delivered cells, chosen across very ' +
        'different biomes so the composites can be judged against terrain the reader recognises. All ' +
        'six are interior cells above 99% valid pixels, so what you see is the whole frame.'),
      h('div', { className: 'gallery' },
        MOSAICS.map(function (m) {
          return h('figure', { key: m[0] },
            h('img', {
              src: IMG[m[0]],
              alt: 'True-colour mosaic of cell ' + m[0].split('_')[0] + ', ' + m[0].split('_')[1] + ' — ' + m[1],
              loading: 'lazy', width: 560, height: 375
            }),
            h('figcaption', null,
              h('span', { className: 'id' }, m[0]),
              h('span', { className: 'where' }, m[1])
            )
          );
        })
      ),
      h('p', { className: 't-note ink-second' },
        'Rendered from the delivered assets at the stretch used by docs/visualize_stuck_mosaics.js.')
    );
  }

  function RunProfile() {
    var days = DAILY.length;
    var core = DAILY.filter(function (d) { return d[0] <= '09-17'; });
    var coreDone = core.reduce(function (a, d) { return a + d[1]; }, 0);
    return h('section', { id: 'throughput' },
      head('Run profile', 'What a day of production actually delivers',
        'Every delivered image carries the moment Earth Engine finished writing it, so the run can ' +
        'be reconstructed day by day after the fact. These are the numbers to plan the next big ' +
        'reprocessing against — they are measured, not estimated.'),
      h('div', { className: 'figures' },
        figureCard(days + ' days', 'Calendar span', '4 to 21 September 2026, start to last straggler'),
        figureCard(num(PEAK_DAY), 'Best day', '8 September — about 51 mosaics an hour sustained'),
        figureCard(num(MEDIAN_DAY), 'Median day', 'the rate to plan with, not the peak'),
        figureCard(RUN_TB + ' TB', 'Written', num(RUN_SCENES) + ' Landsat scenes consumed')
      ),
      h(DS.Panel, { title: 'Mosaics finished per day, and the cumulative total', padding: 24 },
        h('div', { className: 'chart-head' },
          h('div', { className: 'legend' },
            h('span', null, h('i', { style: { background: 'var(--color-primary-700)' } }), 'Finished that day'),
            h('span', null, h('i', { style: { background: 'var(--color-primary-200)' } }), 'Cumulative against the plan')
          )
        ),
        h('div', { className: 'chart-frame', id: 'runframe' },
          h('div', { className: 'chart-scroll' }, raw(runProfileSVG())),
          h('div', { className: 'tip' })
        ),
        h('div', { style: { marginTop: '16px' } },
          h('details', null,
            h('summary', null, 'Figures behind the chart'),
            h('div', { className: 'table-scroll' },
              h('table', null,
                h('caption', null,
                  'Finished is the asset write time; queued is the pipeline’s own build stamp. ' +
                  'Both read from the delivered assets by docs/run_daily_throughput.py.'),
                h('thead', null, h('tr', null,
                  h('th', null, 'Date'), h('th', { className: 'n' }, 'Finished'),
                  h('th', { className: 'n' }, 'Queued'), h('th', { className: 'n' }, 'GB written'),
                  h('th', { className: 'n' }, 'Cumulative')
                )),
                h('tbody', null, (function () {
                  var running = 0;
                  return DAILY.map(function (d) {
                    running += d[1];
                    return h('tr', { key: d[0] },
                      h('td', { className: 'k num' }, d[0].slice(3) + ' Sep'),
                      h('td', { className: 'n' }, num(d[1])),
                      h('td', { className: 'n' }, num(d[2])),
                      h('td', { className: 'n' }, d[3].toFixed(0)),
                      h('td', { className: 'n' }, num(running))
                    );
                  });
                })())
              )
            )
          )
        )
      ),
      h('div', { className: 'prose justify' },
        raw('<p>The shape is not a smooth ramp, and it was never going to be. The queue has a ceiling ' +
            'per account, so the run was fed in <strong>sittings</strong>: the tall queued days — ' +
            '2,394 on the 8th, 2,711 on the 14th — are someone refilling it, and the days that follow ' +
            'are that backlog draining. Delivery is steady around ' + num(MEDIAN_DAY) +
            ' a day whenever the queue has work in it.</p>' +
            '<p><strong>The two flat days are the incident below.</strong> On 5 September the run ' +
            'delivered 1,131 mosaics; on the 6th it delivered 70, and on the 7th 139. Nothing was ' +
            'resubmitted on either day — the queue was full of exports that were computing but being ' +
            'cancelled at six hours. The 8th, after the threshold was raised, is the best day of the ' +
            'whole run.</p>' +
            '<p><strong>' + coreDone.toLocaleString('en-US') + ' of ' + num(BUILT) + ' landed in the first ' +
            core.length + ' days.</strong> The four-day tail is 48 stragglers — re-queued failures and ' +
            'the cells that needed a second attempt. Plan the bulk, then plan a tail.</p>')
      ),
      h(DS.Card, { title: 'Planning the next one' },
        h('div', { className: 'card-body' },
          h(DS.AttributeList, {
            items: [
              { icon: 'CalendarClock', label: 'A full national reprocess, all ' + num(PLAN) +
                ' images: about 18 days at the median rate — the run just closed is the benchmark' },
              { icon: 'CalendarPlus', label: 'One new year, 283 cells: half a day and roughly 0.7 TB' },
              { icon: 'HardDrive', label: 'Storage: ' + GB_PER_MOSAIC.toFixed(1) +
                ' GB a mosaic on average, so budget by cell-years, not by year' },
              { icon: 'Layers', label: 'About 54 Landsat scenes go into each delivered image' },
              { icon: 'TriangleAlert', label: 'Do not plan against the peak: 1,225 happened once, ' +
                'with a drained queue and nothing else competing' }
            ]
          })
        )
      )
    );
  }

  function Incident() {
    return h('section', { id: 'incident' },
      head('Incident', 'The exports that would not finish',
        'Midway through the run, throughput collapsed. The cause turned out to be the remedy we were ' +
        'applying, which is why it is worth recording.'),
      h('div', { className: 'prose justify' },
        raw('<p>A median export takes about <strong>41 minutes</strong>. During the run a growing subset ' +
            'sat in <span class="path">RUNNING</span> for six to forty-seven hours. At the worst point ' +
            '<strong>28 of the 50 slots</strong> were held by them and delivery fell from roughly 50 to ' +
            '22 mosaics an hour.</p>' +
            '<p>The tasks looked stuck, so a six-hour auto-cancel was culling them. Reading ' +
            '<span class="path">batchEecuUsageSeconds</span> on the cancelled operations showed the ' +
            'opposite: they carried 35k to 450k EECU-seconds and were still <strong>climbing</strong>. ' +
            'They were computing, slowly, and the auto-cancel was destroying finished work.</p>' +
            '<p>The measurement that settled it: <span class="path">NG-43-X-D_2017</span>, 250 granules, ' +
            'one of the “stuck” cells. Relaunched against an empty queue it finished in ' +
            '<strong>1.8 hours</strong>.</p>')
      ),
      h(DS.Card, { title: 'Same cell, same graph — EECU consumed per second' },
        h('div', { className: 'card-body justify' },
          h('div', { className: 'compare' },
            h('div', { className: 'row' },
              h('span', { className: 'lab' }, 'Empty queue'),
              h('span', { className: 'bar', style: { width: '100%', background: 'var(--color-primary-700)' } }),
              h('span', { className: 'val' }, '~74/s')
            ),
            h('div', { className: 'row' },
              h('span', { className: 'lab' }, 'Under contention'),
              h('span', { className: 'bar', style: { width: '23%', background: 'var(--color-neutral-400)' } }),
              h('span', { className: 'val' }, '13–21/s')
            )
          ),
          raw('<p style="margin-top:8px">Queue contention, not a defect in the graph. ' +
              '<span class="path">shardSize=32</span> and tighter cloud filters (60 / 40 / 30%) were ' +
              'tried first and changed nothing: the limit sits in the graph, and the pre-computed ' +
              'overpass and witness tables still run to 250 granules.</p>')
        )
      ),
      h('div', { className: 'prose justify' },
        raw('<p><strong>Resolution.</strong> The held cells were relaunched against a drained queue: ' +
            '<strong>69 of 71 completed</strong>, at about two hours each. The auto-cancel threshold was ' +
            'raised from 6 to 48 hours, and the run was finished in sittings rather than as one ' +
            'continuous queue.</p>' +
            '<p>The rule that came out of it: wall-clock does not tell you whether an export is stuck. ' +
            'Rising EECU means it is computing and should be left alone; EECU frozen for hours is a real ' +
            'stall. The two remaining failures are the frozen kind.</p>')
      )
    );
  }

  function Next() {
    var ITEMS = [
      ['Two genuinely stalled exports', 'NH-44-V-A_2021 and NI-43-Z-D_2019 freeze at 44% and 73% of their ' +
        'expected EECU. Find the scene that stalls them.', 'failed', 'Open'],
      ['The empty-overpass guard', 'Treat an empty 6S table as “no correction available” in topo_physics. ' +
        'Releases eight cell-years at no cost.', 'pending', 'Ready to fix'],
      ['Quantify the UNCORRECTED passes', 'Measure the illumination bias left in the L5/L7 passes that ' +
        'shipped without topographic correction.', 'pending', 'To assess'],
      ['Retire the v1 collection', 'INDIA/mosaics-1 still holds about 47 TB. It is a candidate for removal ' +
        'once v2 has replaced it in the downstream classification.', 'inactive', 'Deferred']
    ];
    return h('section', { id: 'next' },
      head('Open items', 'What is left, and what it costs',
        'None of these blocks use of the delivered collection.'),
      h('div', { className: 'items' },
        ITEMS.map(function (it) {
          return h('div', { className: 'item', key: it[0] },
            h('div', { className: 'what justify' },
              h('span', { className: 'k' }, it[0]),
              h('span', { className: 'w' }, it[1])
            ),
            h(DS.StatusPill, { tone: it[2] }, it[3])
          );
        })
      )
    );
  }

  function Access() {
    return h('section', { id: 'access' },
      head('Access', 'Where the data is and how to read it',
        'The collection is the delivery. Everything else in this report describes how it was made.'),
      h('div', { className: 'two-col' },
        h(DS.Card, { title: 'The collection' },
          h('div', { className: 'card-body justify' },
            h('dl', null,
              raw('<dt>Earth Engine asset</dt><dd><span class="path path-block">' +
                  'projects/mapbiomas-mosaics/assets/LANDSAT/LULC/INDIA/mosaics-2</span></dd>' +
                  '<dt>Image id</dt><dd><span class="path">CELL_YEAR</span>, for example ' +
                  '<span class="path">NB-46-X-A_2018</span> — no suffix, no version tag.</dd>' +
                  '<dt>Images</dt><dd>' + num(BUILT) + ', one per delivered cell-year.</dd>')
            )
          )
        ),
        h(DS.Card, { title: 'Reading the bands' },
          h('div', { className: 'card-body justify' },
            h(DS.AttributeList, {
              items: [
                { icon: 'FileText', label: 'docs/collection_description.txt — what every band means' },
                { icon: 'Ruler', label: 'docs/band_value_ranges.md — scaling and valid ranges per band' },
                { icon: 'FileCheck2', label: 'docs/band_and_property_contract.md — the v2 band contract' },
                { icon: 'Map', label: 'docs/viewer_year_slider.js — Code Editor viewer, year by year' },
                { icon: 'GitCompare', label: 'docs/viewer_v1_v2_compare.js — v1 against v2, side by side' }
              ]
            })
          )
        )
      ),
      h('div', { className: 'footer' },
        h('span', { className: 't-note ink-second' },
          'Figures as of 22 September 2026, read from the production collection and the Earth Engine ' +
          'operations log. Cell-year totals: ' + num(BUILT) + ' delivered, ' + num(MISSING) +
          ' not built, ' + num(PLAN) + ' planned.'),
        h('span', { className: 't-note ink-second' },
          'MapBiomas India · IOLN Landsat mosaics, collection v2 · built with the MapBiomas design system.')
      )
    );
  }

  function App() {
    return h(F, null,
      h(Cover), h(Figures), h(Product), h(Method),
      h(Coverage), h(NationalGrid), h(Outcome), h(Gallery), h(RunProfile), h(Incident), h(Next), h(Access)
    );
  }

  try {
    ReactDOM.createRoot(document.getElementById('app')).render(h(App));
    wireCharts();
  } catch (err) {
    if (window.console) console.error('[report] render failed', err);
  }
})();
</script>
