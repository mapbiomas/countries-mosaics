  /* ================= the two custom charts =========================
     Time series, which the report layer has no component for. Built on
     its chart classes (mb-rp-chart, mb-rp-ax, mb-rp-axl, mb-rp-tip) so

  var tipFor = null;

  function coverageSVG() {
    var W = 880, H = 290, L = 44, R = 14, T = 38, B = 30;
    var pw = W - L - R, ph = H - T - B, base = T + ph;
    var step = pw / BUILT_BY_YEAR.length, bw = Math.min(14, step - 6);
    var y = function (v) { return base - (v / CELLS) * ph; };
    var s = [];
    [0, 100, 200, CELLS].forEach(function (t) {
      var yy = y(t);
      s.push('<line class="mb-rp-axl" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '"/>');
      s.push('<text class="mb-rp-ax" x="' + (L - 10) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end">' + t + '</text>');
    });
    var lx = L + step * 0.5;
    s.push('<text class="g-annot" x="' + lx.toFixed(1) + '" y="14" text-anchor="start">1986 — only 30 of 283 cells have a usable scene</text>');
    s.push('<line class="mb-rp-axl" x1="' + lx.toFixed(1) + '" y1="20" x2="' + lx.toFixed(1) + '" y2="' + (T - 2) + '"/>');
    BUILT_BY_YEAR.forEach(function (r, i) {
      var cx = L + step * i + step / 2, x = cx - bw / 2, yb = y(r[1]), miss = CELLS - r[1];
      s.push('<rect class="b-built" x="' + x.toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (base - yb).toFixed(1) + '" rx="2"/>');
      if (miss > 0) {
        var ty = y(CELLS), hh = yb - ty - 2;
        if (hh > 0.5) s.push('<rect class="b-miss" x="' + x.toFixed(1) + '" y="' + ty.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="2"/>');
      }
      if (r[0] === 1986 || r[0] % 5 === 0) {
        s.push('<text class="mb-rp-ax" x="' + cx.toFixed(1) + '" y="' + (base + 18) + '" text-anchor="middle">' + r[0] + '</text>');
      }
      s.push('<rect class="hit" data-c="cov" data-i="' + i + '" x="' + (L + step * i).toFixed(1) + '" y="' + T + '" width="' + step.toFixed(1) + '" height="' + ph + '" fill="transparent"/>');
    });
    return '<svg class="mb-rp-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cells delivered per phenological year, 1986 to 2025, against 283 cells.">' + s.join('') + '</svg>';
  }

  function runSVG() {
    var W = 880, H = 300, L = 52, R = 16, T = 34, BH = 150, CT = 226, CH = 70;
    var pw = W - L - R, bb = T + BH, cb = CT + CH;
    var step = pw / DAILY.length, bw = Math.min(30, step - 8);
    var yd = function (v) { return bb - (v / 1300) * BH; };
    var yc = function (v) { return cb - (v / PLAN) * CH; };
    var s = [];
    [0, 500, 1000].forEach(function (t) {
      var yy = yd(t);
      s.push('<line class="mb-rp-axl" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '"/>');
      s.push('<text class="mb-rp-ax" x="' + (L - 10) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end">' + num(t) + '</text>');
    });
    var sx = L + step * 2, sw = step * 2;
    s.push('<rect class="a-stall" x="' + sx.toFixed(1) + '" y="' + T + '" width="' + sw.toFixed(1) + '" height="' + BH + '"/>');
    s.push('<text class="mb-rp-ax" x="' + (sx + sw / 2).toFixed(1) + '" y="' + (T - 6) + '" text-anchor="middle">queue stall</text>');
    var run = 0, pts = DAILY.map(function (d, i) { run += d[1]; return [L + step * i + step / 2, yc(run)]; });
    var last = pts[pts.length - 1];
    s.push('<path class="a-fill" d="M' + L + ',' + cb + pts.map(function (p) { return ' L' + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('') + ' L' + last[0].toFixed(1) + ',' + cb + ' Z"/>');
    s.push('<path class="a-line" d="M' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L') + '"/>');
    s.push('<line class="mb-rp-axl" x1="' + L + '" y1="' + cb + '" x2="' + (W - R) + '" y2="' + cb + '"/>');
    s.push('<text class="mb-rp-ax" x="' + (L - 10) + '" y="' + (cb + 4) + '" text-anchor="end">0</text>');
    s.push('<text class="mb-rp-ax" x="' + (L - 10) + '" y="' + (yc(PLAN) + 4).toFixed(1) + '" text-anchor="end">' + num(PLAN) + '</text>');
    s.push('<text class="mb-rp-ax" x="' + L + '" y="' + (CT - 8) + '" text-anchor="start">cumulative delivered</text>');
    var pk = 0, pi = 0;
    DAILY.forEach(function (d, i) { if (d[1] > pk) { pk = d[1]; pi = i; } });
    var px = L + step * pi + step / 2;

      s.push('<text class="mb-rp-ax" x="' + cx.toFixed(1) + '" y="' + (bb + 18) + '" text-anchor="middle">' + d[0].slice(3) + '</text>');

      tip.innerHTML = '<span class="mb-rp-tip-k"></span><span class="mb-rp-tip-v"></span>';

      var fr = box.getBoundingClientRect(), hr = t.getBoundingClientRect();
      var half = tip.offsetWidth / 2, pad = 8;
      var x = hr.left - fr.left + hr.width / 2;
      tip.style.left = Math.max(half + pad, Math.min(fr.width - half - pad, x)) + 'px';
      tip.style.top = Math.max(tip.offsetHeight + pad, e.clientY - fr.top) + 'px';
    });

        for (var i = 0; i < t.length; i++) t[i].style.opacity = '0';

                'that failed to build.</p>'))),

        h(S, { eyebrow: 'The product', id: 'product',
               title: 'One image per cell, per phenological year',
               lead: 'A mosaic is a single annual image for one grid cell, composed from every ' +
                     'usable Landsat scene that fell on it during the agricultural year.' },
          h(Table, {
            caption: 'The v2 contract, pinned offline by tests/test_pipeline_contract.py.',
            columns: [{ value: 'Property' }, { value: 'Value' }],
            rows: [
              ['Phenological year', '1 April of year Y to 31 March of Y+1 — “2019” is April 2019 to March 2020'],
              ['Spatial unit', 'One cell of the 1:250,000 CIM grid; 283 tile the classification regions'],
              ['Period', '1986 to 2025, forty consecutive phenological years'],
              ['Resolution', '30 m, the native Landsat grid'],
              [{ value: 'Bands', em: true }, { value: '117 — reflectance medians, dry/wet quartiles, indices, the 24-band SMA family, seasonality, terrain, provenance counts', em: true }]
            ]
          })),

        h(S, { eyebrow: 'Method', id: 'method',
               title: 'The order of operations is the method',
               lead: 'Each correction assumes the previous one has already run. Changing the ' +
                     'sequence changes the physics, not just the plumbing.' },
          h(Flow, {
            steps: STEPS.map(function (s, i) {
              return { key: String(i + 1).padStart(2, '0'), title: s[0], description: s[1],
                       status: 'done', statusLabel: 'in order' };
            })
          }),
          h('div', { className: 'stack', style: { marginTop: '24px' } },
            raw('<p><strong>Sources.</strong> Landsat Collection 2, Tier 1, Level 2 surface ' +
                'reflectance — L5, L7, L8 and L9 as each year allows, filtered at ' +
                '<code>CLOUD_COVER &lt; 95</code>. Level 2 carries no illumination geometry, so ' +
                'the collection is inner-joined with Level 1 for the four angle bands. SLC-off L7 ' +
                'is admitted only into quarters where the clean sensors run thin.</p>' +
                '<p><strong>Radiometry.</strong> BRDF normalisation to nadir by the c-factor of ' +
                'Roy et al. (2016) on RTLSR kernels. Sensor harmonisation keeps the forty-year ' +
                'series continuous: TM→ETM+ derived from India’s own 1999–2011 overlap, ETM+→OLI ' +
                'from Roy (2016). Row overlap is de-duplicated by pass key before compositing.</p>' +
                '<p><strong>Terrain and masking.</strong> Topographic correction is SCS+C with a ' +
                'physical C read per sensor from 6S tables, with MERRA-2 aerosol optical thickness ' +
                'and water vapour at the hour of overpass. Cloud and shadow are removed by a ' +
                'witness mask: Collection 2 QA bits combined with a per-pixel thermal witness built ' +
                'from that pixel’s clear-sky history. Both must agree.</p>' +
                '<p><strong>Compositing and SMA.</strong> Per pixel the year reduces to a median ' +
                'plus a dry and a wet composite — the p25 and p75 of the observations ordered by ' +
                'NDVI — and two measures of travel: swing (p95 − p5) and the median absolute ' +
                'deviation. Reducing by quartile rather than calendar month keeps the composites ' +
                'comparable across a country whose monsoon arrives on very different dates.</p>'),
            h(Note, { tone: 'neutral', title: 'How to read this:' },
              ' the authoritative description of the method is the ATBD, and every tunable value ' +
              'lives in pipeline/config.py. This report records the run, not the algorithm. The ' +
              'SMA endmembers are inherited from the Amazon and were not re-derived for India — ' +
              'the first thing to revisit if the SMA bands disagree with field expectation.'))),

        h(S, { eyebrow: 'Coverage', id: 'coverage',
               title: 'What the archive allowed, year by year',
               lead: 'Each column is one phenological year against the full ' + CELLS +
                     '-cell grid. Where a column falls short, the Landsat archive is short.' },
          h(Fig, { caption: 'Figure 1 — Cells delivered per phenological year, against the 283-cell grid. ' +
                            'Filled is delivered, grey is not built. Source: the production collection, 23 September 2026.' },
            chart(coverageSVG())),
          h('div', { className: 'mb-rp-legend-row' },
            h('span', { className: 'mb-rp-key' },
              h('span', { className: 'mb-rp-sw', style: { background: 'var(--color-action-bg)' } }), 'Delivered'),
            h('span', { className: 'mb-rp-key' },
              h('span', { className: 'mb-rp-sw', style: { background: 'var(--color-neutral-300)' } }), 'Not built')),
          h('div', { style: { marginTop: '24px' } },
            raw('<p><strong>1986 is the thin year</strong>: 30 cells of 283. Only Landsat 5 was ' +
                'flying, on a single pass, and much of the Indian archive from that year was never ' +
                'downlinked. 1987 and 1988 recover to about 220, and from 1989 the series is above ' +
                '95% every year but 1998. From 1999 onward the grid is essentially complete — ' +
                '<strong>25 of the forty years deliver all 283 cells</strong>, and only 2000 and ' +
                '2010 fall short after that, by one and three cells.</p>')),
          h('details', null,
            h('summary', null, 'Figures behind the chart'),
            h(Table, {
              caption: 'Cells delivered and not built, out of ' + CELLS + ', per phenological year.',
              columns: [{ value: 'Year' }, { value: 'Delivered', align: 'right' },
                        { value: 'Not built', align: 'right' }, { value: 'Coverage', align: 'right' }],
              rows: BUILT_BY_YEAR.map(function (r) {
                return [{ value: String(r[0]), em: true }, num(r[1]), String(CELLS - r[1]),
                        (r[1] / CELLS * 100).toFixed(1) + '%'];
              })
            }))),

        h(S, { eyebrow: 'National scale', id: 'national',
               title: 'Forty years of India, one tile a year',
               lead: 'Every phenological year mosaicked to the whole country, at the same extent ' +
                     'and the same stretch. Read across and the archive fills in.' },
          h(Fig, { caption: 'Figure 2 — The national mosaic for each phenological year, 1986 to 2025. ' +
                            'Red, green and blue medians stretched 0–4,000 at gamma 1.3. The count under ' +
                            'each tile is the cells delivered that year.' },
            h('div', { className: 'years' },
              BUILT_BY_YEAR.map(function (r) {
                return h('div', { className: 'year-tile', key: r[0] },
                  h('img', { src: IMG['india_' + r[0]], loading: 'lazy', width: 450, height: 480,
                             alt: 'National mosaic of India for ' + r[0] + ', ' + r[1] + ' of ' + CELLS + ' cells' }),
                  h('div', { className: 'cap' },
                    h('span', { className: 'y' }, r[0]),
                    h('span', { className: 'c' }, r[1] + '/' + CELLS)));
              }))),
          h('div', { style: { marginTop: '16px' } },
            h(Note, { title: 'Black is two different things:' },
              ' around the country it is the region mask, the last step of the build, which drops ' +
              'every pixel outside the union of the classification regions — so the outline you ' +
              'read as India is the mask, not the sensor. Black cutting across the interior is the ' +
              'archive: cells with no usable scene that year. The bands through 1987 and 1988 are ' +
              'whole Landsat rows that were never downlinked.'))),

        h(S, { eyebrow: 'Outcome', id: 'outcome',
               title: 'Every planned image accounted for',
               lead: 'The plan is ' + num(PLAN) + ' images. The collection is the source of truth ' +
                     'for what was delivered; the remainder is classified by cause.' },
          h(Fig, { caption: 'Figure 3 — The plan by outcome. Widths are the share of ' + num(PLAN) + ' cell-years.' },
            h(Stack, {
              title: 'The ' + num(PLAN) + '-image plan, by outcome',
              segments: [
                { label: 'Delivered', value: BUILT },
                { label: 'Archive gap', value: GAPS },
                { label: 'Blocked by the overpass guard', value: BLOCKED }
              ],
              ticks: [{ at: 0, label: '0' }, { at: PLAN / 2, label: num(PLAN / 2) }, { at: PLAN, label: num(PLAN) }],
              format: function (v) { return num(v) + ' cell-years'; },
              note: 'Nothing is unaccounted for: the three shares sum to the plan exactly.'
            })),
          h('div', { style: { marginTop: '24px' } },
            h(Table, {
              caption: 'Reconciliation against the plan, 23 September 2026.',
              columns: [{ value: 'Outcome' }, { value: 'Cell-years', align: 'right' },
                        { value: 'Share', align: 'right' }, { value: 'Why' }],
              rows: [
                [{ pill: { tone: 'ok', label: 'Delivered' } }, { value: num(BUILT), em: true }, PCT + '%',
                 'Written to the production collection and readable as an Earth Engine asset.'],
                [{ pill: { tone: 'off', label: 'Archive gap' } }, { value: num(GAPS), em: true }, '4.1%',
                 'No usable Landsat granule exists for that cell-year. Skipped as an honest gap, not a failure.'],
                [{ pill: { tone: 'warn', label: 'Blocked' } }, { value: String(BLOCKED), em: true }, '0.07%',
                 'The 6S overpass table comes back empty and the topographic step raises NoneType has no len(). The only defect still holding images back.']
              ]
            })),
          h('div', { style: { marginTop: '16px' } },
            h(Note, { title: 'A quality caveat worth reading:' },
              ' some L5 and L7 passes have no matching row in the 6S table for their cell and date. ' +
              'Those passes ship without topographic correction, with a WARNING … ship UNCORRECTED ' +
              'in the run log. The images are delivered and usable, but the affected passes carry a ' +
              'slope-dependent illumination bias that has not been quantified.'))),

        h(S, { eyebrow: 'The images', id: 'mosaics',
               title: 'Six mosaics, six landscapes',
               lead: 'True-colour renderings of delivered cells across very different biomes. All ' +
                     'six are interior cells above 99% valid pixels, so what you see is the whole frame.' },
          h(Fig, { caption: 'Figure 4 — Sample cells, red/green/blue medians at the same stretch as Figure 2.' },
            h('div', { className: 'cells' },
              CELLS_SHOWN.map(function (m) {
                return h('div', { className: 'cell', key: m[0] },
                  h('img', { src: IMG[m[0]], loading: 'lazy', width: 560, height: 375,
                             alt: 'True-colour mosaic of cell ' + m[0] + ' — ' + m[1] }),
                  h('span', { className: 'id' }, m[0]),
                  h('span', { className: 'where' }, m[1]));
              })))),

        h(S, { eyebrow: 'Run profile', id: 'run',
               title: 'What a day of production actually delivers',
               lead: 'Every delivered image carries the moment Earth Engine finished writing it, so ' +
                     'the run reconstructs day by day. These are the numbers to plan the next big ' +
                     'reprocessing against — measured, not estimated.' },
          h(Panel, {
            title: 'The run', status: { tone: 'ok', label: 'closed' },
            metrics: [
              { label: 'Calendar span', value: DAILY.length + ' days', note: '4 to 23 September 2026' },
              { label: 'Production rate', value: num(BULK_RATE) + '/day', note: 'over the ' + BULK_DAYS + ' days that delivered ' + num(BULK_DONE) },
              { label: 'Best day', value: num(PEAK_DAY), note: '8 September, about 51 an hour' },
              { label: 'Written', value: RUN_TB + ' TB', note: num(RUN_SCENES) + ' scenes consumed' }
            ]
          }),
          h('div', { style: { marginTop: '24px' } },
            h(Fig, { caption: 'Figure 5 — Mosaics finished each day, above, and the cumulative total ' +
                              'against the plan, below, on one shared axis. The shaded pair is the stall.' },
              chart(runSVG()))),
          h('div', { style: { marginTop: '24px' } },
            raw('<p>The shape is not a smooth ramp. The queue has a ceiling per account, so the run ' +
                'was fed in <strong>sittings</strong>: the tall queued days — 2,394 on the 8th, 2,711 ' +
                'on the 14th — are someone refilling it, and the days that follow are that backlog ' +
                'draining. Delivery averages ' + num(BULK_RATE) + ' a day whenever the queue has work in it.</p>' +
                '<p><strong>The two flat days are the incident below.</strong> On 5 September the run ' +
                'delivered 1,131 mosaics; on the 6th it delivered 70, and on the 7th 139. Nothing was ' +
                'resubmitted on either day. The 8th, after the auto-cancel threshold was raised, is the ' +
                'best day of the whole run.</p>' +
                '<p><strong>' + num(BULK_DONE) + ' of ' + num(BUILT) + ' landed in the first ' + BULK_DAYS +
                ' days.</strong> Everything after is a tail of 50 stragglers at one or two a day. Plan the ' +
                'bulk, then plan a tail: the tail is cheap in machines and expensive in calendar.</p>')),
          h('details', null,
            h('summary', null, 'Figures behind the chart'),
            h(Table, {
              caption: 'Finished is the asset write time; queued is the pipeline’s own build stamp. ' +
                       'Both read from the delivered assets by docs/run_daily_throughput.py.',
              columns: [{ value: 'Date' }, { value: 'Finished', align: 'right' },
                        { value: 'Queued', align: 'right' }, { value: 'GB', align: 'right' },
                        { value: 'Cumulative', align: 'right' }],
              rows: (function () {
                var run = 0;
                return DAILY.map(function (d) {
                  run += d[1];
                  return [{ value: d[0].slice(3) + ' Sep', em: true }, num(d[1]), num(d[2]),
                          d[3].toFixed(0), num(run)];
                });
              })()
            })),
          h('div', { style: { marginTop: '24px' } },
            h(Panel, {
              title: 'Planning the next one',
              metrics: [
                { label: 'Full reprocess', value: '~15 days', note: num(PLAN) + ' images at ' + num(BULK_RATE) + '/day, 20 with a tail' },
                { label: 'One new year', value: '<1 day', note: '283 cells, roughly 0.7 TB' },
                { label: 'Storage', value: GB_PER_MOSAIC + ' GB', note: 'per mosaic, on average' },
                { label: 'Input', value: '~54', note: 'Landsat scenes per delivered image' }
              ]
            }))),

        h(S, { eyebrow: 'Incident', id: 'incident',
               title: 'The exports that would not finish',
               lead: 'Midway through the run, throughput collapsed. The cause turned out to be the ' +
                     'remedy we were applying, which is why it is worth recording.' },
          raw('<p>A median export takes about <strong>41 minutes</strong>. During the run a growing ' +
              'subset sat in <code>RUNNING</code> for six to forty-seven hours. At the worst point ' +
              '<strong>28 of the 50 slots</strong> were held by them and delivery fell from roughly 50 ' +
              'to 22 mosaics an hour.</p>' +
              '<p>The tasks looked stuck, so a six-hour auto-cancel was culling them. Reading ' +
              '<code>batchEecuUsageSeconds</code> on the cancelled operations showed the opposite: they ' +
              'carried 35k to 450k EECU-seconds and were still <strong>climbing</strong>. They were ' +
              'computing, slowly, and the auto-cancel was destroying finished work.</p>'),
          h('div', { style: { marginTop: '24px' } },
            h(Fig, { caption: 'Figure 6 — The same cell, the same graph, run twice. ' +
                              'NG-43-X-D_2017, 250 granules, relaunched against a drained queue.' },
              h(Bars, {
                title: 'EECU consumed per second',
                bars: [
                  // The component's label column is 150px; notes must fit it.
                  { label: 'Empty queue', note: 'finished in 1.8 h', value: 74 },
                  { label: 'Under contention', note: 'same graph, 5\u00d7 slower', value: 17 }
                ],
                max: 90, ticks: [0, 30, 60, 90], unit: 'EECU/s',
                format: function (v) { return String(v); }
              }))),
          h('div', { style: { marginTop: '24px' } },
            raw('<p>Queue contention, then, not a defect in the graph. <code>shardSize=32</code> and ' +
                'tighter cloud filters were tried first and changed nothing: the limit sits in the ' +
                'graph, and the pre-computed overpass and witness tables still run to 250 granules. ' +
                'The held cells were relaunched against a drained queue and <strong>69 of 71 ' +
                'completed</strong>, at about two hours each. The auto-cancel threshold went from 6 ' +
                'hours to 48.</p>' +
                '<p>Two cells survived that rescue and were written up as genuinely stalled, frozen ' +
                'part-way by some specific scene. <strong>They were not.</strong> Relaunched against an ' +
                'empty queue on 22 September, both finished: 3h40m and 11h30m, about 400,000 EECU each. ' +
                'The “44% and 73%” in the original write-up were fractions of a total nobody had ' +
                'measured — the real cost is around 400,000, so they were at roughly 53% and 83%, ' +
                'simply at the slow end of the distribution.</p>')),
          h('div', { style: { marginTop: '16px' } },
            h(Note, { title: 'The rule this corrects:' },
              ' wall-clock does not tell you whether an export is stuck, but neither does a frozen ' +
              'EECU counter. On the successful re-run one of these two sat at 412,065 for an hour and ' +
              'twelve minutes without moving, then finished. The counter advances in steps, and a ' +
              'plateau of half an hour is ordinary. All 71 held cells were queue contention; the ' +
              'pipeline’s real stall rate is zero.'))),

        h(S, { eyebrow: 'Open items', id: 'open',
               title: 'What is left, and what it costs',
               lead: 'None of these blocks use of the delivered collection.' },
          h(Risks, {
            items: [
              { tone: 'warn', marker: 'R1', title: 'The empty-overpass guard is the last defect holding images back',
                body: 'Eight cell-years have between one and six granules, but the 6S overpass table ' +
                      'for them comes back empty and the topographic step calls len() on it. ' +
                      'NC-43-Y-C (1989, 2000, 2010), NC-44-Y-C_1989, NG-46-Z-D_1986, NH-44-X-C_1987, ' +
                      'NI-43-V-C_1986, NI-44-Y-D_1988.',
                fix: 'Treat an empty table as “no correction available”; releases all eight and takes the collection to 10,857.' },
              { tone: 'warn', marker: 'R2', title: 'Some passes shipped without topographic correction',
                body: 'L5 and L7 passes with no matching 6S row are exported uncorrected and logged. ' +
                      'The bias is slope-dependent and has not been measured.',
                fix: 'Quantify the illumination bias on the affected cells and years.' },
              { tone: 'info', marker: 'R3', title: 'The SMA endmembers are not Indian',
                body: 'The 24-band SMA family is unmixed with endmembers inherited from the Amazon, ' +
                      'recorded in the pre-flight and never re-derived for India.',
                fix: 'Revisit first if the SMA bands disagree with field expectation.' },
              { tone: 'off', marker: 'R4', title: 'The v1 collection still holds about 47 TB',
                body: 'INDIA/mosaics-1 remains in place while v2 proves itself downstream.',
                fix: 'Candidate for removal once v2 has replaced it in the classification.' }
            ]
          })),

        h(S, { eyebrow: 'Access', id: 'access',
               title: 'Where the data is and how to read it',
               lead: 'The collection is the delivery. Everything else in this report describes how it was made.' },
          h(Table, {
            caption: 'Figures as of 23 September 2026, read from the production collection.',
            columns: [{ value: 'What' }, { value: 'Where' }],
            rows: [
              [{ value: 'Earth Engine asset', em: true }, 'projects/mapbiomas-mosaics/assets/LANDSAT/LULC/INDIA/mosaics-2'],
              ['Image id', 'CELL_YEAR, for example NB-46-X-A_2018 — no suffix, no version tag'],
              ['Images', num(BUILT) + ', one per delivered cell-year'],
              ['Band meanings', 'docs/collection_description.txt'],
              ['Scaling and ranges', 'docs/band_value_ranges.md'],
              ['The v2 band contract', 'docs/band_and_property_contract.md'],
              ['Code Editor viewers', 'docs/viewer_year_slider.js · docs/viewer_v1_v2_compare.js']
            ]
          })))
    );
  }

  try {
    ReactDOM.createRoot(document.getElementById('app')).render(h(Report));
    wireCharts();
  } catch (err) {
    if (window.console) console.error('[report] render failed', err);
  }
})();
</script>
